name: Refresh GitHub contributions wall

on:
  schedule:
    - cron: "17 6 * * 1" # every Monday 06:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Regenerate contributions wall
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/gen-wall.mjs

      - name: Commit changes if any
        run: |
          if [ -n "$(git status --porcelain public/ data/contributions.json)" ]; then
            git config user.name "royalpinto007"
            git config user.email "royalpinto007@gmail.com"
            git add public/wall*.svg data/contributions.json
            git commit -m "chore: refresh contribution walls"
            git push
          else
            echo "no change in contributions"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Production includes Facetworks and every demo in one asset bundle.
      # Publish through Open-Source/Final; deploying this repo's out/ alone
      # would omit those paths. This job refreshes and validates source only.
